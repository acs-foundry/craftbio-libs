[workspace]
resolver = "3"
members = [
    "crates/sandbox",
    "crates/struct",
    "crates/scene",
    "crates/viewport",
    "crates/report",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/acs-foundry/craftbio-libs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[workspace.dependencies]
# Upstream ArtCraft shared infrastructure (storytold/craft-libs pinned commit)
craft-ipc = { git = "https://github.com/storytold/craft-libs", rev = "52d2560c183b2df8b1ffc25ca2078683af146fd6" }

# Internal workspace crates
craftbio-struct = { path = "crates/struct" }
craftbio-scene = { path = "crates/scene" }

# Standard Rust ecosystem crates (offline-cached)
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1.5"
egui = "0.31"
egui-wgpu = "0.31"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
png = "0.18"
rayon = "1.10"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = "24"
